version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # A Redocly bump also needs the vendored CLI sources and the embedded bundle refreshed (see js/README.md);
  # the bundle job fails on the pull request until that is done.
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode verify -Prun-its
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: js/.nvmrc, cache: npm, cache-dependency-path: js/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: js
      - run: npm run build -- ../target/redocly-core.mjs ../target/THIRD-PARTY-NOTICES.txt
        working-directory: js
      - run: cmp target/redocly-core.mjs src/main/resources/net/mwalser/openapi/toolkit/redocly/redocly-core.mjs
      - run: cmp target/THIRD-PARTY-NOTICES.txt src/main/resources/META-INF/THIRD-PARTY-NOTICES.txt
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: graalvm, java-version: '25' }
      - run: mvn --batch-mode test -Pisolate-tests
